{
  "name": "Example problem",
  "description": "Report a reproducible problem in the free workflow examples using synthetic data.",
  "title": "[Example] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "For problems in this repository's examples only. Report hosted Actor failures on that Actor's Apify Issues tab. Do not start a paid run just to fill out this form. GitHub issues are public: never include real contacts, recordings, messages, tokens, webhook URLs, signed links, or raw account responses."
      }
    },
    {
      "type": "input",
      "id": "example",
      "attributes": {
        "label": "Example file and revision",
        "description": "Name the script or guide and commit SHA or download date.",
        "placeholder": "read_xml_batches.py, commit …"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "environment",
      "attributes": {
        "label": "Environment",
        "description": "Python version, operating system, or workflow platform version. Do not include private paths or account identifiers."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reproduction",
      "attributes": {
        "label": "Minimal synthetic reproduction",
        "description": "Provide the smallest invented input and exact steps. Replace personal details with fictional values. Paste commands with credential values omitted."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "expected",
      "attributes": {
        "label": "Expected result"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "actual",
      "attributes": {
        "label": "Actual result",
        "description": "Include only the relevant redacted error or output. For a timeout, say whether you inspected the existing run before retrying; do not paste its input or credentials."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Before submitting",
        "options": [
          {
            "label": "The reproduction is synthetic and contains no personal data, credentials, webhook URLs or signed links.",
            "required": true
          },
          {
            "label": "I understand that preparing this report does not require a new paid Actor run.",
            "required": true
          }
        ]
      }
    }
  ]
}
